# fly.toml app configuration file generated for wichtelwerkstatt on 2026-10-25T13:55:43Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wichtelwerkstatt'
primary_region = 'ams'

[build]

[env]
  DATA_FILE = '/data/wichtel.json'
  PORT = '3000'

[[mounts]]
  source = 'wichtel_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 3000  # muss zu PORT passen
  force_https = true
  # Immer an lassen: geplante Ziehungen werden jede Minute geprüft.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
